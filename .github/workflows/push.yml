name: Feature Deploy Push
on:
  push:
    branches:
      - '**'
    paths:
      - 'terraform/**'
      - 'scripts/**'
      - 'GNUmakefile'
      - '.github/**'
      - 'secretstemplate'
permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
    - name: fmt-check
      run: |
        terraform fmt -recursive -check .

  lint:
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: terraform-linters/setup-tflint@8093687ecc9dcbfa88d07c103ad4176739a7287e # v4.1.0
      name: Setup TFLint
      with:
        tflint_version: v0.64.0

    - name: tflint
      run: |
        echo "***Running terraform lint***"
        tflint --recursive

  validate:
    needs: [lint]
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
    - name: Select branch tfvars secret
      run: |-
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        _suffix=$(printf '%s' "${_branch}" | tr '[:lower:]/.-' '[:upper:]___')
        case "${_suffix}" in
          *[!A-Za-z0-9_]*|[0-9]*)
            echo "ERROR: cannot derive a valid secret name from branch: ${_branch}"
            exit 1
            ;;
        esac
        echo "PING_EXPORT_SECRET_NAME=PING_EXPORT_TFVARS_${_suffix}" >> "${GITHUB_ENV}"
    - run: |-
        umask 077
        _secrets_file=$(mktemp)
        _tfvars_file=$(mktemp)
        trap 'rm -f "${_secrets_file}" "${_tfvars_file}"' EXIT
        if ! printf '%s' "${TERRAFORM_ENV_BASE64}" | base64 -d > "${_secrets_file}" 2>/tmp/b64err; then echo "DIAG: TERRAFORM_ENV_BASE64 decode failed: $(cat /tmp/b64err)"; fi
        if [ -n "${PING_EXPORT_TFVARS_B64-}" ] && ! printf '%s' "${PING_EXPORT_TFVARS_B64}" | base64 -d > /dev/null 2>/tmp/b64err2; then echo "DIAG: PING_EXPORT_TFVARS_B64 decode failed: $(cat /tmp/b64err)"; fi
        . "${_secrets_file}"
        [ -n "${PING_EXPORT_TFVARS_B64-}" ] || {
          echo "ERROR: secret ${PING_EXPORT_SECRET_NAME} is not set; run ./scripts/upload_ping_export_tfvars.sh" >&2
          exit 1
        }
        printf '%s' "${PING_EXPORT_TFVARS_B64}" | base64 -d > "terraform/ping-export-terraform.auto.tfvars"
        unset PING_EXPORT_TFVARS_B64
        _tfdir=terraform
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        export TF_VAR_pingone_environment_name="${_branch}"
        case $_branch in
          prod)
            _stateKey="${TF_VAR_tf_state_key_prefix}/prod/terraform.tfstate"
            ;;
          qa)
            _stateKey="${TF_VAR_tf_state_key_prefix}/qa/terraform.tfstate"
            ;;
          *)
            _stateKey="${TF_VAR_tf_state_key_prefix}/dev/${_branch}/terraform.tfstate"
            ;;
        esac
        terraform -chdir="${_tfdir}" init -input=false \
          -backend-config="bucket=${TF_VAR_tf_state_bucket}" \
          -backend-config="region=${TF_VAR_tf_state_region}" \
          -backend-config="key=${_stateKey}"
        echo "***Running terraform validate***"
        terraform -chdir="${_tfdir}" validate
      env:
        PING_EXPORT_TFVARS_B64: ${{ secrets[env.PING_EXPORT_SECRET_NAME] }}

  deploy:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') && github.ref_type == 'branch' }}
    name: Deploy
    needs: [validate]
    concurrency:
      group: terraform-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
    - name: Select branch tfvars secret
      run: |-
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        _suffix=$(printf '%s' "${_branch}" | tr '[:lower:]/.-' '[:upper:]___')
        case "${_suffix}" in
          *[!A-Za-z0-9_]*|[0-9]*)
            echo "ERROR: cannot derive a valid secret name from branch: ${_branch}"
            exit 1
            ;;
        esac
        echo "PING_EXPORT_SECRET_NAME=PING_EXPORT_TFVARS_${_suffix}" >> "${GITHUB_ENV}"
    - run: |-
        umask 077
        _secrets_file=$(mktemp)
        _tfvars_file=$(mktemp)
        trap 'rm -f "${_secrets_file}" "${_tfvars_file}"' EXIT
        printf '%s' "${TERRAFORM_ENV_BASE64}" | base64 -d > "${_secrets_file}"
        . "${_secrets_file}"
        [ -n "${PING_EXPORT_TFVARS_B64-}" ] || {
          echo "ERROR: secret ${PING_EXPORT_SECRET_NAME} is not set; run ./scripts/upload_ping_export_tfvars.sh" >&2
          exit 1
        }
        printf '%s' "${PING_EXPORT_TFVARS_B64}" | base64 -d > "terraform/ping-export-terraform.auto.tfvars"
        unset PING_EXPORT_TFVARS_B64
        _tfdir=terraform
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        export TF_VAR_pingone_environment_name="${_branch}"
        case $_branch in
          prod)
            _stateKey="${TF_VAR_tf_state_key_prefix}/prod/terraform.tfstate"
            ;;
          qa)
            _stateKey="${TF_VAR_tf_state_key_prefix}/qa/terraform.tfstate"
            ;;
          *)
            _stateKey="${TF_VAR_tf_state_key_prefix}/dev/${_branch}/terraform.tfstate"
            ;;
        esac
        terraform -chdir="${_tfdir}" init -input=false \
          -backend-config="bucket=${TF_VAR_tf_state_bucket}" \
          -backend-config="region=${TF_VAR_tf_state_region}" \
          -backend-config="key=${_stateKey}"
        echo "***Running terraform apply***"
        terraform -chdir="${_tfdir}" apply --auto-approve -input=false
      env:
        PING_EXPORT_TFVARS_B64: ${{ secrets[env.PING_EXPORT_SECRET_NAME] }}