<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An example integration between Ping Identity services and a custom app, including Terraform HCL to auto-provision and configure a sample PingOne environment.">
  <title>Ping Identity Integration Example Application</title>
  <link rel="shortcut icon" type="/image/x-icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <img class="background" src="/images/background.png" alt="Background" />
  <section class="container">
    <div class="header">
      <div class="logo"><img src="images/logo.png" width="300" alt="Ping Identity" /></div>
      <div class="header-text">
        <div class="title">Developer Experience</div>
        <div class="subtitle">PingOne Branded Sign-On Sample App</div>
      </div>
    </div>
    <div class="content">
      <h1>Welcome!</h1>
      <div id="error-msg"></div>
      <br>
      <div id="container">
        <p>Click below to sign in or register. Authentication is delivered by the
        environment's branded sign-on experience (DaVinci flow policy assigned to
        the application).</p>
        <button id="login" class="btn">Sign In / Register</button>
      </div>
    </div>
  </section>
  <script src="global.js"></script>
  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', () => {
      const envId = window._env_.pingOneEnvId;
      const domain = window._env_.pingOneDomain; // PingOne Domain based on region
      const clientId = window._env_.oidcClientId;
      const redirectUri = window._env_.redirectUri;

      document.getElementById('login').addEventListener('click', () => {
        // Redirect to the PingOne application's authorization endpoint. The
        // app's assigned DaVinci flow policy renders the environment-branded
        // sign-on / registration forms, then returns to redirectUri with ?code=...
        const authorizeUrl = 'https://auth.pingone.' + domain + '/' + envId + '/as/authorize'
          + '?response_type=code'
          + '&client_id=' + encodeURIComponent(clientId)
          + '&redirect_uri=' + encodeURIComponent(redirectUri)
          + '&scope=openid profile email';
        window.location.assign(authorizeUrl);
      });

      // Returning from the authorization redirect? Hand off to the dashboard.
      const params = new URLSearchParams(window.location.search);
      if (params.get('code')) {
        window.location.assign(window.location.origin + '/dashboard.html?' + params.toString());
      }
      if (params.get('error')) {
        document.getElementById('error-msg').innerText =
          'Sign-on error: ' + params.get('error') + ' — ' + (params.get('error_description') || '');
      }
    });
  </script>
</body>
</html>
